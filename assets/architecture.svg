<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d">
  <title id="t">Architecture</title>
  <desc id="d">A user joins a LiveKit room. A Python agent worker receives the audio, runs Munsit speech-to-text, a free OpenRouter LLM with tools, and Munsit text-to-speech, then speaks back into the room. A Pipecat bot can replace the agent worker on the same room.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="head"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .room { fill: #eef2ff; stroke: #818cf8; stroke-width: 1.5; }
    .worker { fill: #f0fdfa; stroke: #2dd4bf; stroke-width: 1.5; }
    .alt { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .step { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; }
    .h { fill: #0f172a; font: 700 15px 'Segoe UI', system-ui, sans-serif; }
    .t { fill: #334155; font: 400 13px 'Segoe UI', system-ui, sans-serif; }
    .s { fill: #64748b; font: 400 12px 'Segoe UI', system-ui, sans-serif; }
    .line { stroke: #64748b; stroke-width: 1.6; fill: none; }
    .head { fill: #64748b; }
    .lbl { fill: #475569; font: 600 11px 'Segoe UI', system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; }
      .room { fill: #1b1f3a; stroke: #6366f1; }
      .worker { fill: #0f2a27; stroke: #14b8a6; }
      .alt { fill: #2a1d10; stroke: #f97316; }
      .step { fill: #0d1117; stroke: #484f58; }
      .h { fill: #e6edf3; }
      .t { fill: #c9d1d9; }
      .s { fill: #8b949e; }
      .line { stroke: #8b949e; }
      .head { fill: #8b949e; }
      .lbl { fill: #9ba7b4; }
    }
  </style>
  <rect class="bg" width="960" height="470" rx="12"/>

  <!-- User -->
  <rect class="box" x="24" y="150" width="170" height="130" rx="12"/>
  <text class="h" x="109" y="182" text-anchor="middle">User</text>
  <text class="t" x="109" y="208" text-anchor="middle">Browser · CLI · phone</text>
  <text class="s" x="109" y="232" text-anchor="middle">mic audio / chat text</text>
  <text class="s" x="109" y="252" text-anchor="middle">short-lived room token</text>

  <!-- LiveKit room -->
  <rect class="room" x="250" y="130" width="190" height="170" rx="12"/>
  <text class="h" x="345" y="164" text-anchor="middle">LiveKit room</text>
  <text class="t" x="345" y="190" text-anchor="middle">Cloud or local server</text>
  <text class="s" x="345" y="216" text-anchor="middle">WebRTC audio tracks</text>
  <text class="s" x="345" y="236" text-anchor="middle">text streams · RPC</text>
  <text class="s" x="345" y="256" text-anchor="middle">attributes · dispatch</text>

  <!-- arrows user <-> room -->
  <path class="line" d="M194 200 H246" marker-end="url(#a)"/>
  <path class="line" d="M250 236 H198" marker-end="url(#a)"/>
  <text class="lbl" x="222" y="192" text-anchor="middle">speak</text>
  <text class="lbl" x="222" y="254" text-anchor="middle">hear</text>

  <!-- Agent worker -->
  <rect class="worker" x="496" y="24" width="440" height="290" rx="12"/>
  <text class="h" x="516" y="52">Python agent worker · LiveKit Agents</text>
  <text class="s" x="516" y="72">AgentSession: VAD + turn detection + interruptions</text>

  <rect class="step" x="516" y="90" width="120" height="62" rx="10"/>
  <text class="h" x="576" y="116" text-anchor="middle">STT</text>
  <text class="s" x="576" y="136" text-anchor="middle">Munsit munsit-en-ar</text>

  <rect class="step" x="656" y="90" width="120" height="62" rx="10"/>
  <text class="h" x="716" y="116" text-anchor="middle">LLM</text>
  <text class="s" x="716" y="136" text-anchor="middle">OpenRouter :free</text>

  <rect class="step" x="796" y="90" width="120" height="62" rx="10"/>
  <text class="h" x="856" y="116" text-anchor="middle">TTS</text>
  <text class="s" x="856" y="136" text-anchor="middle">Munsit · Mansour</text>

  <path class="line" d="M636 121 H652" marker-end="url(#a)"/>
  <path class="line" d="M776 121 H792" marker-end="url(#a)"/>

  <!-- tools / desk -->
  <rect class="step" x="516" y="178" width="400" height="118" rx="10"/>
  <text class="h" x="536" y="204">Multi-agent desk</text>
  <text class="t" x="536" y="228">Triage  →  Orders · FAQ specialists (handoffs)</text>
  <text class="s" x="536" y="250">Tools: lookup_faq · get_order_status (ownership checked in code)</text>
  <text class="s" x="536" y="270">Identity from signed token attributes · metrics · RPC desk.state</text>
  <path class="line" d="M716 152 V174" marker-end="url(#a)"/>

  <!-- room <-> worker -->
  <path class="line" d="M440 180 C470 180 470 121 512 121" marker-end="url(#a)"/>
  <path class="line" d="M916 121 H926 V305 H486 C462 305 452 288 444 272" marker-end="url(#a)"/>
  <text class="lbl" x="470" y="140" text-anchor="middle">audio in</text>
  <text class="lbl" x="466" y="268" text-anchor="middle">voice out</text>

  <!-- Pipecat alternative -->
  <rect class="alt" x="496" y="344" width="440" height="100" rx="12"/>
  <text class="h" x="516" y="372">Alternative: Pipecat bot (same room)</text>
  <text class="t" x="516" y="396">LiveKitTransport → Munsit STT → OpenRouter → Munsit TTS</text>
  <text class="s" x="516" y="418">One orchestrator per conversation: Agents or Pipecat, not both</text>
  <path class="line" d="M345 300 C345 394 420 394 492 394" marker-end="url(#a)"/>
</svg>
